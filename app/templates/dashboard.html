<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #editor-container { height: calc(100vh - 250px); }
        #result-container { height: calc(100vh - 250px); overflow-y: auto; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">

    <header class="bg-gray-800 border-b border-gray-700 p-4 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold text-blue-400">{{ title }}</h1>
            <p class="text-sm text-gray-400">Escreva seu código Python e teste os agentes</p>
            <input id="file-name" type="text" placeholder="Nome do arquivo (opcional)" class="mt-2 px-3 py-1 bg-gray-700 text-white rounded border border-gray-600 focus:outline-none focus:border-blue-400">
        </div>
        <div class="flex gap-3">
            <button id="btn-detect" class="px-4 py-2 bg-yellow-600 hover:bg-yellow-500 text-white rounded font-medium transition">
                🔍 Detectar Smells
            </button>
            <button id="btn-refactor" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded font-medium transition">
                ✨ Refatorar Código
            </button>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-2 gap-4 p-4">
        
        <div class="flex flex-col bg-gray-800 rounded border border-gray-700 overflow-hidden">
            <div class="bg-gray-700 px-4 py-2 text-sm font-semibold border-b border-gray-600">
                Input (Python)
            </div>
            <div id="editor-container" class="w-full"></div>
        </div>

        <div class="flex flex-col bg-gray-800 rounded border border-gray-700 overflow-hidden">
            <div class="bg-gray-700 px-4 py-2 text-sm font-semibold border-b border-gray-600">
                Output
            </div>
            <div id="result-container" class="p-4 text-sm text-gray-300 overflow-y-auto"></div>
        </div>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
    
    <script>
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' }});
        
        let editor;

        require(['vs/editor/editor.main'], function() {
            editor = monaco.editor.create(document.getElementById('editor-container'), {
                value: [
                    'def calculate_total(items, discount_rate, tax_rate):',
                    '    total = 0',
                    '    for item in items:',
                    '        total += item.price',
                    '    ',
                    '    total = total - (total * discount_rate)',
                    '    total = total + (total * tax_rate)',
                    '    return total'
                ].join('\n'),
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: false }
            });
        });

        const resultContainer = document.getElementById('result-container');

        function formatResponse(data) {
            if (data.has_smell !== undefined) {
                // SmellDetection
                const smellIcon = data.has_smell ? '🚨' : '✅';
                const smellColor = data.has_smell ? 'text-red-400' : 'text-green-400';
                return `
                    <div class="mb-4">
                        <h3 class="text-lg font-bold ${smellColor}">${smellIcon} Detecção de Smells</h3>
                        <p><strong>Smell Detectado:</strong> ${data.has_smell ? 'Sim' : 'Não'}</p>
                        <p><strong>Tipo:</strong> ${data.smell_type}</p>
                        ${data.line_start ? `<p><strong>Linha Inicial:</strong> ${data.line_start}</p>` : ''}
                        ${data.line_end ? `<p><strong>Linha Final:</strong> ${data.line_end}</p>` : ''}
                        ${data.affected_snippet ? `<p><strong>Trecho Afetado:</strong></p><pre class="bg-gray-700 p-2 rounded text-sm overflow-x-auto">${data.affected_snippet}</pre>` : ''}
                        <p><strong>Justificativa:</strong></p>
                        <p class="text-gray-300">${data.reasoning}</p>
                    </div>
                `;
            } else if (data.detection) {
                let html = formatResponse(data.detection);
                if (data.proposal) {
                    html += `
                        <div class="mb-4">
                            <h3 class="text-lg font-bold text-blue-400">✨ Proposta de Refatoração</h3>
                            <p><strong>Pattern Aplicado:</strong> ${data.proposal.applied_pattern}</p>
                            <p><strong>Explicação Arquitetural:</strong></p>
                            <p class="text-gray-300">${data.proposal.architectural_explanation}</p>
                            <p><strong>Benefícios Esperados:</strong></p>
                            <ul class="list-disc list-inside text-gray-300">
                                ${data.proposal.expected_benefits.map(b => `<li>${b}</li>`).join('')}
                            </ul>
                            <p><strong>Código Refatorado:</strong></p>
                            <pre class="bg-gray-700 p-2 rounded text-sm overflow-x-auto">${data.proposal.refactored_code}</pre>
                        </div>
                    `;
                }
                if (data.review) {
                    html += `
                        <div class="mb-4">
                            <h3 class="text-lg font-bold text-yellow-400">🔍 Revisão</h3>
                            <p><strong>Aprovado:</strong> ${data.review.is_approved ? 'Sim' : 'Não'}</p>
                            ${data.review.critique ? `<p><strong>Crítica:</strong> ${data.review.critique}</p>` : ''}
                            ${data.review.final_validated_code ? `<p><strong>Código Final:</strong></p><pre class="bg-gray-700 p-2 rounded text-sm overflow-x-auto">${data.review.final_validated_code}</pre>` : ''}
                        </div>
                    `;
                }
                html += `<p><strong>Iterações:</strong> ${data.iterations}</p>`;
                html += `<p><strong>Aprovado:</strong> ${data.approved ? 'Sim' : 'Não'}</p>`;
                return html;
            } else {
                return `<pre>${JSON.stringify(data, null, 2)}</pre>`;
            }
        }

        async function callAgentAPI(endpoint) {
            if (!editor) {
                console.log('Editor not loaded');
                return;
            }

            const code = editor.getValue();
            const fileName = document.getElementById('file-name').value || null;
            console.log('Calling API:', endpoint, 'with code:', code, 'file:', fileName);
            resultContainer.textContent = "Processando agentes... aguarde...";
            resultContainer.classList.add("text-yellow-400");

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ source_code: code, file_name: fileName })
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                resultContainer.classList.remove("text-yellow-400");

                if (response.ok) {
                    resultContainer.classList.add("text-green-400");
                    resultContainer.innerHTML = formatResponse(data);
                } else {
                    resultContainer.classList.add("text-red-400");
                    resultContainer.textContent = `Erro: ${data.detail || JSON.stringify(data)}`;
                }
            } catch (error) {
                console.log('Fetch error:', error);
                resultContainer.classList.add("text-red-400");
                resultContainer.textContent = `Erro de rede: ${error.message}`;
            }
        }
        document.getElementById('btn-detect').addEventListener('click', () => {
            callAgentAPI('/api/v1/detect'); 
        });

        document.getElementById('btn-refactor').addEventListener('click', () => {
            callAgentAPI('/api/v1/refactor'); 
        });
    </script>
</body>
</html>
