services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: refactor-os-app
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?MISTRAL_API_KEY is required}
      LLM_MODEL_ID: ${LLM_MODEL_ID:-mistral-medium-latest}
      MAX_REFLECTION_ITERATIONS: ${MAX_REFLECTION_ITERATIONS:-3}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./dataset:/app/dataset:ro
