services:
  postgres:
    image: agnohq/pgvector:16
    container_name: refactor-os-postgres
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai
    ports:
      - "5532:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: refactor-os-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:?MISTRAL_API_KEY is required}
      LLM_MODEL_ID: ${LLM_MODEL_ID:-mistral-medium-latest}
      DB_URL: postgresql+psycopg://ai:ai@postgres:5432/ai
      KNOWLEDGE_TABLE: ${KNOWLEDGE_TABLE:-design_patterns_kb}
      MAX_REFLECTION_ITERATIONS: ${MAX_REFLECTION_ITERATIONS:-3}
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app:ro
      - ./dataset:/app/dataset:ro

volumes:
  pgdata: