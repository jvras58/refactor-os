[project]
name = "refactor-os"
version = "0.1.0"
description = "Sistema multi-agente determinístico para refatoração orientada por Design Patterns."
authors = [
    { name = "jvras", email = "jonasilv@emeal.nttdata.com" },
]
readme = "Readme.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "ruff>=0.6.0",
    "python-dotenv>=1.0.0",
    "mistralai>=2.4.5",
    "jinja2>=3.1.6",
    "sqlalchemy>=2.0.51",
    "psycopg[binary]>=3.3.4",
    "pgvector>=0.4.2",
    "huggingface-hub>=1.21.0",
    "ollama>=0.6.2",
    "openai>=2.44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "mypy>=1.11.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
